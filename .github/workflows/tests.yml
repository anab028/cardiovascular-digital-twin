name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: End-to-end benchmark smoke test
        run: cardiotwin --train 10 --calibration 10 --test 10 --output /tmp/cardiotwin-smoke
