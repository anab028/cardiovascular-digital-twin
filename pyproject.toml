[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiovascular-digital-twin"
version = "0.1.0"
description = "An in-silico cardiovascular personalization benchmark with identifiability and uncertainty experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25,<3", "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
cardiotwin = "cardiotwin.benchmark:main"

[tool.setuptools.packages.find]
include = ["cardiotwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
